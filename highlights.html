<title>مقتطفات الديوان الأول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Scrolling showcase: diwan name, a swipeable 9:16 card carousel, then a video-playlist card. Warm identity palette, Amiri display. */
  :root{
    --bg:#E8DEC9; --panel:#EFE6D2; --ink:#3A2C28; --muted:#8A7A68;
    --oud:#8E1E2C; --oud2:#6E1420; --line:rgba(58,44,40,.16); --card:#F3EAD6;
    --shadow:0 18px 42px rgba(58,44,40,.20);
    --disp:'Amiri',Georgia,serif; --ui:'Tajawal',system-ui,sans-serif;
    --cardH:clamp(400px,64vh,620px);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#1f1612; --panel:#2a1e19; --ink:#ECE2CF; --muted:#b7a68e;
    --oud:#D6454F; --oud2:#8E1E2C; --line:rgba(236,226,207,.14); --card:#F3EAD6;
    --shadow:0 22px 50px rgba(0,0,0,.55); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#1f1612; --panel:#2a1e19; --ink:#ECE2CF; --muted:#b7a68e;
    --oud:#D6454F; --oud2:#8E1E2C; --line:rgba(236,226,207,.14); --card:#F3EAD6;
    --shadow:0 22px 50px rgba(0,0,0,.55); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
       direction:rtl;-webkit-tap-highlight-color:transparent;line-height:1.6}
  .wrap{max-width:660px;margin:0 auto;
        padding-left:max(16px,env(safe-area-inset-left,0px));
        padding-right:max(16px,env(safe-area-inset-right,0px))}

  .hero{text-align:center;padding-block:clamp(22px,5vh,46px) clamp(14px,3vh,26px)}
  .kicker{font-weight:700;font-size:12px;letter-spacing:4px;color:var(--oud);text-transform:uppercase}
  .hero h1{font-family:var(--disp);font-weight:700;margin:.4rem 0 .2rem;
           font-size:clamp(26px,6vw,40px);line-height:1.22;text-wrap:balance}
  .hero .by{margin:0;color:var(--muted);font-size:14px;letter-spacing:.5px}
  .rule{width:60px;height:3px;background:var(--oud);border-radius:3px;margin:14px auto 0;opacity:.9}

  section{padding-block:clamp(16px,3.4vh,30px)}
  .eyebrow{display:inline-block;font-weight:700;font-size:11px;letter-spacing:3px;
           color:var(--oud);text-transform:uppercase;margin-bottom:4px}
  .block-head{text-align:center;margin-bottom:16px}
  .block-head h2{font-family:var(--disp);font-weight:700;font-size:clamp(20px,4.6vw,26px);margin:0}

  /* carousel */
  .stage{position:relative;height:var(--cardH)}
  .viewport{height:100%;overflow:hidden;direction:ltr;touch-action:pan-y;border-radius:16px}
  .track{display:flex;height:100%;will-change:transform}
  .slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
             border-radius:16px;box-shadow:var(--shadow);background:var(--card);
             border:1px solid var(--line);-webkit-user-drag:none;user-select:none}
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:44px;
       border-radius:50%;border:1px solid var(--line);color:var(--oud);cursor:pointer;padding:0;
       background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);
       display:grid;place-items:center;transition:transform .15s ease}
  .nav:hover{transform:translateY(-50%) scale(1.08)}
  .nav:active{transform:translateY(-50%) scale(.94)}
  .nav:disabled{opacity:.3;cursor:default}
  .nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .nav.next{left:-6px}.nav.prev{right:-6px}
  @media (max-width:520px){.nav.next{left:4px}.nav.prev{right:4px}}
  .nav:focus-visible{outline:2px solid var(--oud);outline-offset:3px}
  .controls{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
  .dots{display:flex;direction:rtl;gap:7px;flex-wrap:wrap;justify-content:center}
  .dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--line);transition:width .2s,background .2s}
  .dot.on{width:22px;border-radius:5px;background:var(--oud)}
  .dot:focus-visible{outline:2px solid var(--oud);outline-offset:2px}
  .counter{direction:ltr;font-family:var(--disp);font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* video playlist card */
  .videocard{display:block;position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
             text-decoration:none;color:#F3EAD6;border:1px solid var(--line);box-shadow:var(--shadow);
             background:linear-gradient(135deg,var(--oud) 0%,var(--oud2) 100%)}
  .videocard .ornament{position:absolute;inset:0;opacity:.14;
    background:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 22px);
    mix-blend-mode:overlay}
  .videocard .play{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);
    width:74px;height:74px;border-radius:50%;background:#F3EAD6;display:grid;place-items:center;
    box-shadow:0 10px 26px rgba(0,0,0,.3);transition:transform .18s ease}
  .videocard:hover .play{transform:translate(-50%,-50%) scale(1.08)}
  .videocard .play::before{content:"";border-style:solid;border-width:15px 0 15px 25px;
    border-color:transparent transparent transparent var(--oud);margin-left:6px}
  .videocard .vmeta{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;direction:rtl;
    background:linear-gradient(to top,rgba(0,0,0,.42),transparent)}
  .videocard .vtitle{font-family:var(--disp);font-weight:700;font-size:clamp(18px,4.4vw,23px);line-height:1.3}
  .videocard .vsub{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95;margin-top:4px}
  .yt{display:inline-flex;align-items:center;gap:6px;font-weight:700;background:rgba(0,0,0,.28);
      padding:3px 9px;border-radius:6px}
  .yt svg{width:17px;height:17px}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

  footer{text-align:center;color:var(--muted);font-size:13px;padding-block:26px 34px}
  footer .fh{font-family:var(--disp);color:var(--ink);font-size:16px}
  footer a{color:var(--oud);text-decoration:none;font-weight:700}
  @media (prefers-reduced-motion:reduce){.track{transition:none!important}}
</style>

<div class="wrap">
  <header class="hero">
    <div class="kicker">مُقتطفات الديوان الأوّل</div>
    <h1>لِيَقرأَ الحبُّ في عَينيكِ أكوابَه</h1>
    <p class="by">أمير عمر باخميس</p>
    <div class="rule"></div>
  </header>

  <section aria-label="بطاقات شعرية">
    <div class="block-head"><span class="eyebrow">بطاقات شعريّة</span><h2>مقاطعُ مختارة</h2></div>
    <div class="stage">
      <button class="nav prev" id="prev" aria-label="السابق"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
      <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
      <button class="nav next" id="next" aria-label="التالي"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button>
    </div>
    <div class="controls">
      <div class="dots" id="dots"></div>
      <div class="counter" id="counter">1 / 10</div>
    </div>
  </section>

  <section aria-label="مقاطع الفيديو">
    <div class="block-head"><span class="eyebrow">فيديو</span><h2>مقاطعُ الديوان على يوتيوب</h2></div>
    <a class="videocard" href="https://www.youtube.com/playlist?list=PLG1rp3Au9a5c" target="_blank" rel="noopener">
      <div class="ornament"></div>
      <div class="play" aria-hidden="true"></div>
      <div class="vmeta">
        <div class="vtitle">مقتطفات الديوان الأوّل</div>
        <div class="vsub">
          <span class="yt"><svg viewBox="0 0 24 24" fill="#fff"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 4.8 12 4.8 12 4.8s-7 0-8.9.6A3 3 0 0 0 1 7.5 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1c1.9.6 8.9.6 8.9.6s7 0 8.9-.6A3 3 0 0 0 23 16.5 31 31 0 0 0 23.5 12 31 31 0 0 0 23 7.5zM9.8 15.3V8.7l5.7 3.3z"/></svg>YouTube</span>
          <span>قائمة التشغيل كاملة</span>
        </div>
      </div>
    </a>
    <p class="hint">اضغط البطاقة لمشاهدة المقاطع على القناة.</p>
  </section>

  <footer>
    <div class="fh">أمير عمر باخميس</div>
    <div>تابِع الجديد: <a href="https://instagram.com/ameeromar_1997" target="_blank" rel="noopener">ameeromar_1997@</a></div>
  </footer>
</div>

<script>
(function(){
  var matali=[
    "أَعَكَسْتِ عَقْرَبَةَ الزَّمانِ بِعِشْقِنا","يا أحمرَ الخدَّينِ قُل لي ما تَرى",
    "لم يَعُدْ بَيني وقَلبي غيرُ حُبِّكْ","وأوَدُّ لو أنَّ الأنامَ جميعَهُم",
    "أعيدي على قَلبي معَ العيدِ بَهجَتي","لماذا يموتُ الحبُّ في آخِرِ النَّفَقْ",
    "أبكي لِلَيلى والدُّموعُ على الوَرَقْ","لِعَينَيكِ قَلبي حينَ تَبدو يُكَبِّرُ",
    "مِتْ عَزيزًا مِثلَما ماتَ قَلبُكْ","لأنَّكِ مِنّي لا أرى بَينَنا فَرقا"
  ];
  var N=10, idx=0;
  var track=document.getElementById('track'),vp=document.getElementById('viewport'),
      dotsEl=document.getElementById('dots'),counter=document.getElementById('counter'),
      prevB=document.getElementById('prev'),nextB=document.getElementById('next');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function toAr(s){return String(s).replace(/[0-9]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[+d];});}
  for(var i=0;i<N;i++){
    var s=document.createElement('div');s.className='slide';
    var im=document.createElement('img');im.src='img'+(i+1)+'.webp';im.alt=matali[i];
    im.draggable=false;im.decoding='async';if(i>0)im.loading='lazy';
    s.appendChild(im);track.appendChild(s);
    var d=document.createElement('button');d.className='dot'+(i===0?' on':'');
    d.setAttribute('aria-label','المقطع '+toAr(i+1));
    (function(k){d.addEventListener('click',function(){go(k);});})(i);
    dotsEl.appendChild(d);
  }
  var dots=dotsEl.children;
  function vw(){return vp.clientWidth;}
  function apply(animate){
    track.style.transition=(animate&&!reduce)?'transform .42s cubic-bezier(.4,0,.2,1)':'none';
    track.style.transform='translateX('+(-idx*vw())+'px)';
  }
  function sync(){
    for(var i=0;i<N;i++)dots[i].className='dot'+(i===idx?' on':'');
    counter.textContent=toAr(idx+1)+' / '+toAr(N);
    prevB.disabled=(idx===0);nextB.disabled=(idx===N-1);
  }
  function go(i){i=Math.max(0,Math.min(N-1,i));idx=i;apply(true);sync();}
  nextB.addEventListener('click',function(){go(idx+1);});
  prevB.addEventListener('click',function(){go(idx-1);});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft')go(idx+1);else if(e.key==='ArrowRight')go(idx-1);
  });
  var dragging=false,startX=0,dx=0,moved=false;
  vp.addEventListener('pointerdown',function(e){dragging=true;moved=false;startX=e.clientX;dx=0;track.style.transition='none';try{vp.setPointerCapture(e.pointerId);}catch(_){}});
  vp.addEventListener('pointermove',function(e){
    if(!dragging)return;dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;
    var max=vw(),t=-idx*max+dx;
    if((idx===0&&dx>0)||(idx===N-1&&dx<0))t=-idx*max+dx*0.35;
    track.style.transform='translateX('+t+'px)';
  });
  function endDrag(){if(!dragging)return;dragging=false;var thr=Math.max(46,vw()*0.14);
    if(dx<=-thr)go(idx+1);else if(dx>=thr)go(idx-1);else apply(true);dx=0;}
  vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);
  vp.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();}},true);
  window.addEventListener('resize',function(){apply(false);});
  apply(false);sync();
})();
</script>
